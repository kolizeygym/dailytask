<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f172a" />
<title>My Weekly Planner</title>
<style>
  :root{
    --bg:#f7f8fa;
    --card:#ffffff;
    --text:#0f172a;
    --muted:#64748b;
    --line:#e6e9ef;
    --accent:#2563eb;
    --accent-soft:#e8efff;
    --green:#16a34a;
    --red:#dc2626;
    --radius:16px;
    --shadow:0 1px 2px rgba(15,23,42,.06), 0 8px 24px rgba(15,23,42,.06);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    font-size:15px;
    line-height:1.45;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap{max-width:820px; margin:0 auto; padding:16px 14px 90px;}

  /* Header */
  header.app-head{
    display:flex; flex-direction:column; gap:4px; margin-bottom:16px;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .logo{
    width:32px; height:32px; border-radius:9px; background:var(--accent);
    display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:16px;
    flex:none;
  }
  .brand h1{font-size:18px; margin:0; font-weight:650; letter-spacing:-.01em;}
  .today{color:var(--muted); font-size:13px; margin:0;}

  /* Tabs (days) */
  .days{
    display:flex; gap:6px; overflow-x:auto; padding:2px 2px 10px; margin:0 -2px 12px;
    scrollbar-width:none;
  }
  .days::-webkit-scrollbar{display:none;}
  .day-btn{
    flex:none; border:1px solid var(--line); background:var(--card); color:var(--muted);
    border-radius:999px; padding:8px 14px; font-size:14px; font-weight:500; cursor:pointer;
    transition:background .15s, color .15s, border-color .15s;
  }
  .day-btn:hover{border-color:#cbd5e1;}
  .day-btn.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .day-btn .dot{
    display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--green);
    margin-left:6px; vertical-align:middle;
  }

  /* Cards */
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:16px; margin-bottom:14px;
  }
  .card h2{font-size:16px; margin:0 0 12px; font-weight:600; letter-spacing:-.01em;}

  /* Progress */
  .progress-top{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:8px;}
  .progress-pct{font-size:22px; font-weight:700; letter-spacing:-.02em;}
  .progress-pct small{font-size:13px; color:var(--muted); font-weight:500; margin-left:4px;}
  .progress-count{color:var(--muted); font-size:13px;}
  .bar{height:9px; border-radius:999px; background:#eef1f5; overflow:hidden;}
  .bar > i{display:block; height:100%; width:0%; background:var(--accent); border-radius:999px; transition:width .25s ease;}
  .bar.green > i{background:var(--green);}

  /* Task list */
  ul.tasks{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
  li.task{
    display:flex; align-items:flex-start; gap:10px;
    border:1px solid var(--line); border-radius:12px; padding:10px 12px; background:#fff;
  }
  li.task.done{background:#fbfdfb; border-color:#dcefe2;}
  li.task.done .t-title{text-decoration:line-through; color:var(--muted);}
  li.task.done .t-time{color:#94a3b8;}
  .check{
    flex:none; width:22px; height:22px; border-radius:6px; border:1.5px solid #cbd5e1;
    background:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center;
    margin-top:1px; padding:0;
  }
  .check svg{width:14px; height:14px; opacity:0; color:#fff;}
  li.task.done .check{background:var(--green); border-color:var(--green);}
  li.task.done .check svg{opacity:1;}
  .t-body{flex:1; min-width:0;}
  .t-time{font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums;}
  .t-title{font-size:15px; word-wrap:break-word; overflow-wrap:anywhere;}
  .t-actions{display:flex; gap:2px; flex:none;}
  .icon-btn{
    border:none; background:transparent; cursor:pointer; padding:6px; border-radius:8px;
    color:var(--muted); display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover{background:#f1f5f9; color:var(--text);}
  .icon-btn.danger:hover{background:#fef2f2; color:var(--red);}
  .icon-btn svg{width:17px; height:17px;}

  .empty{
    text-align:center; color:var(--muted); font-size:14px; padding:22px 10px;
    border:1px dashed var(--line); border-radius:12px; background:#fafbfc;
  }

  /* Buttons */
  .btn{
    border:1px solid var(--line); background:#fff; color:var(--text); border-radius:11px;
    padding:10px 14px; font-size:14px; font-weight:550; cursor:pointer; display:inline-flex;
    align-items:center; justify-content:center; gap:7px;
  }
  .btn:hover{background:#f8fafc;}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.primary:hover{background:#1d4ed8;}
  .btn.block{width:100%;}
  .btn.danger{color:var(--red); border-color:#f1c9c9;}
  .btn.danger:hover{background:#fef2f2;}
  .btn svg{width:16px; height:16px;}
  .row{display:flex; gap:8px; flex-wrap:wrap;}
  .row > .btn{flex:1 1 auto;}

  /* Footer actions */
  .foot-actions{margin-top:6px;}
  details.tools{margin-top:12px;}
  details.tools summary{
    cursor:pointer; color:var(--muted); font-size:13.5px; font-weight:500; padding:6px 0;
    list-style:none;
  }
  details.tools summary::-webkit-details-marker{display:none;}
  details.tools summary::before{content:"⚙ ";}
  .tools-body{padding-top:8px; display:flex; flex-direction:column; gap:8px;}

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(15,23,42,.45); display:none;
    align-items:center; justify-content:center; padding:16px; z-index:50;
  }
  .overlay.open{display:flex;}
  .modal{
    background:#fff; border-radius:18px; width:100%; max-width:420px; padding:18px;
    box-shadow:0 20px 60px rgba(15,23,42,.25);
  }
  .modal h3{margin:0 0 14px; font-size:17px; font-weight:650;}
  .field{display:flex; flex-direction:column; gap:6px; margin-bottom:12px;}
  .field label{font-size:13px; color:var(--muted); font-weight:500;}
  .field input{
    width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px;
    font-size:15px; font-family:inherit; color:var(--text); background:#fff;
  }
  .field input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
  .field .hint{font-size:12px; color:var(--muted);}
  .modal-actions{display:flex; gap:8px; margin-top:6px;}
  .modal-actions .btn{flex:1;}
  .err{color:var(--red); font-size:13px; margin:-4px 0 8px; display:none;}
  .err.show{display:block;}

  /* Stats */
  .stat-row{display:flex; justify-content:space-between; font-size:13.5px; padding:7px 0; border-bottom:1px solid #f1f4f8;}
  .stat-row:last-child{border-bottom:none;}
  .stat-row .d{color:var(--muted);}
  .stat-row .v{font-variant-numeric:tabular-nums; font-weight:550;}
  .toast{
    position:fixed; left:50%; bottom:20px; transform:translateX(-50%) translateY(20px);
    background:#0f172a; color:#fff; padding:10px 16px; border-radius:10px; font-size:13.5px;
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:60; max-width:90vw;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (min-width:640px){
    .wrap{padding:24px 20px 100px;}
    .brand h1{font-size:20px;}
    .card{padding:20px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="app-head">
    <div class="brand">
      <div class="logo">W</div>
      <h1>My Weekly Planner</h1>
    </div>
    <p class="today" id="todayLine"></p>
  </header>

  <nav class="days" id="daysNav"></nav>

  <!-- День -->
  <section class="card">
    <h2 id="dayTitle">Понедельник</h2>

    <div class="progress-top">
      <div class="progress-pct" id="dayPct">0%<small>выполнено</small></div>
      <div class="progress-count" id="dayCount">0 из 0 задач</div>
    </div>
    <div class="bar"><i id="dayBar"></i></div>

    <div style="height:14px"></div>
    <ul class="tasks" id="taskList"></ul>
    <div style="height:12px"></div>
    <button class="btn primary block" id="addTaskBtn">+ Добавить задачу</button>

    <div class="row" style="margin-top:8px;">
      <button class="btn" id="markAllBtn">Отметить всё</button>
      <button class="btn danger" id="resetDayBtn">Сбросить прогресс дня</button>
    </div>
  </section>

  <!-- Неделя -->
  <section class="card">
    <h2>Прогресс за неделю</h2>
    <div class="progress-top">
      <div class="progress-pct" id="weekPct">0%<small>за неделю</small></div>
      <div class="progress-count" id="weekCount">0 из 0 задач</div>
    </div>
    <div class="bar green"><i id="weekBar"></i></div>
  </section>

  <!-- Статистика -->
  <section class="card">
    <h2>Статистика по дням</h2>
    <div id="statsList"></div>
  </section>

  <!-- Инструменты -->
  <section class="card foot-actions">
    <details class="tools">
      <summary>Данные и резервная копия</summary>
      <div class="tools-body">
        <button class="btn block" id="exportBtn">Экспорт данных (JSON)</button>
        <button class="btn block" id="importBtn">Импорт данных из JSON</button>
        <input type="file" id="importFile" accept="application/json,.json" style="display:none" />
        <button class="btn danger block" id="resetAllBtn">Сбросить весь прогресс недели</button>
        <button class="btn danger block" id="resetTemplateBtn">Сбросить шаблон расписания</button>
      </div>
    </details>
  </section>

</div>

<!-- Модалка задачи -->
<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h3 id="modalTitle">Добавить задачу</h3>
    <div class="err" id="modalErr"></div>
    <div class="field">
      <label for="fTitle">Название задачи</label>
      <input id="fTitle" type="text" placeholder="Например: Английский" autocomplete="off" />
    </div>
    <div class="row" style="gap:10px;">
      <div class="field" style="flex:1;">
        <label for="fStart">Начало</label>
        <input id="fStart" type="time" />
      </div>
      <div class="field" style="flex:1;">
        <label for="fEnd">Конец</label>
        <input id="fEnd" type="time" />
      </div>
    </div>
    <div class="hint" style="margin:-6px 0 12px;">Можно оставить время пустым — задача без времени.</div>
    <div class="modal-actions">
      <button class="btn" id="modalCancel">Отмена</button>
      <button class="btn primary" id="modalSave">Сохранить</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  /* ---------- Константы ---------- */
  const DAYS = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
  const DAYS_FULL = ["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"];
  const STORAGE_KEY = "myWeeklyPlanner.v1";

  /* ---------- Стартовое расписание (шаблон) ---------- */
  function starterTemplate(){
    // [title, start, end]  (end/start могут быть "")
    const mk = arr => arr.map(a => ({ id: uid(), title: a[0], start: a[1] || "", end: a[2] || "" }));
    return {
      "0": mk([
        ["Завтрак","08:00","09:00"],
        ["Английский","09:00","11:00"],
        ["Тренировка","11:00","14:00"],
        ["Обед","14:00","15:00"],
        ["Работа","15:00","17:00"],
        ["Ужин","17:00","18:00"],
        ["Права","18:00","19:30"],
        ["Свободное время","19:30","21:00"]
      ]),
      "1": mk([
        ["Завтрак","06:00","07:00"],
        ["Пары","08:00","11:00"],
        ["Обед","12:00","13:00"],
        ["Домашка","13:00","15:00"],
        ["Тренировка","15:00","18:00"],
        ["Ужин","18:00","19:00"],
        ["Английский","19:00","21:00"],
        ["Права","21:00","22:00"]
      ]),
      "2": mk([
        ["Завтрак","08:00","09:00"],
        ["Английский","09:00","11:00"],
        ["Тренировка","11:00","14:00"],
        ["Обед","14:00","15:00"],
        ["Работа","15:00","17:00"],
        ["Ужин","17:00","18:00"],
        ["Права","18:00","19:30"],
        ["Свободное время","19:30","21:00"]
      ]),
      "3": mk([
        ["Завтрак","08:00","09:00"],
        ["Английский","09:00","11:00"],
        ["Тренировка","11:00","14:00"],
        ["Обед","14:00","15:00"],
        ["Работа","15:00","17:00"],
        ["Ужин","17:00","18:00"],
        ["Права","18:00","19:30"],
        ["Свободное время","19:30","21:00"]
      ]),
      "4": mk([
        ["Завтрак","07:00","08:00"],
        ["Учёба","09:00","14:00"],
        ["Обед","15:00","16:00"],
        ["Домашка","16:00","18:30"],
        ["Тренировка","18:30","21:00"],
        ["Вокабуляр","21:00","22:00"]
      ]),
      "5": mk([
        ["Завтрак","07:00","08:00"],
        ["Учёба","09:00","15:00"],
        ["Ужин","16:00","17:00"],
        ["Учёба","17:00","19:00"],
        ["Тренировка и спать","19:00","22:00"]
      ]),
      "6": mk([
        ["Уборка","10:00","12:00"],
        ["Английский + спикинг","12:00","14:00"]
      ])
    };
  }

  /* ---------- Утилиты ---------- */
  function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  function todayIndex(){
    // JS: 0=Вс ... 6=Сб. Наш массив: 0=Пн ... 6=Вс
    return (new Date().getDay() + 6) % 7;
  }
  function dateKeyNow(){
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  function formatTodayLine(){
    const d = new Date();
    const months = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
    const dayIdx = todayIndex();
    return DAYS_FULL[dayIdx] + ", " + d.getDate() + " " + months[d.getMonth()] + " " + d.getFullYear();
  }
  function timeLabel(t){
    if(!t.start && !t.end) return "Без времени";
    if(t.start && t.end) return t.start + "–" + t.end;
    if(t.start) return "с " + t.start;
    return "до " + t.end;
  }
  function toast(msg){
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove("show"), 2200);
  }
  function clamp(n, a, b){ return Math.max(a, Math.min(b, n)); }
  function pct(done, total){ return total === 0 ? 0 : Math.round(done / total * 100); }

  /* ---------- Состояние ---------- */
  let state = null;      // { template: {dayIdx:[tasks]}, progress: {dateKey:{dayIdx:{taskId:bool}}}, activeDay }
  let activeDay = todayIndex();
  let editingId = null;  // null => добавление, иначе id редактируемой задачи
  let modalDay = 0;

  function defaultState(){
    return {
      version: 1,
      template: starterTemplate(),
      progress: {},
      activeDay: todayIndex()
    };
  }

  function normalizeState(raw){
    // Приводим к безопасному виду, даже если данные повреждены
    const def = defaultState();
    if(!raw || typeof raw !== "object") return def;
    const out = { version: 1, template: {}, progress: {}, activeDay: clamp(Number(raw.activeDay)||0, 0, 6) };

    const srcTemplate = (raw.template && typeof raw.template === "object") ? raw.template : {};
    for(let i=0;i<7;i++){
      const arr = Array.isArray(srcTemplate[i]) ? srcTemplate[i] : (Array.isArray(srcTemplate[String(i)]) ? srcTemplate[String(i)] : []);
      out.template[i] = arr
        .filter(t => t && typeof t === "object")
        .map(t => ({
          id: (typeof t.id === "string" && t.id) ? t.id : uid(),
          title: typeof t.title === "string" ? t.title : "Без названия",
          start: typeof t.start === "string" ? t.start : "",
          end: typeof t.end === "string" ? t.end : ""
        }));
    }

    if(raw.progress && typeof raw.progress === "object"){
      for(const dateKey of Object.keys(raw.progress)){
        const byDay = raw.progress[dateKey];
        if(!byDay || typeof byDay !== "object") continue;
        const clean = {};
        for(const d of Object.keys(byDay)){
          const di = Number(d);
          if(!Number.isInteger(di) || di < 0 || di > 6) continue;
          const map = byDay[d];
          if(!map || typeof map !== "object") continue;
          clean[di] = {};
          for(const tid of Object.keys(map)){
            if(map[tid] === true) clean[di][tid] = true;
          }
        }
        out.progress[dateKey] = clean;
      }
    }
    return out;
  }

  function load(){
    let raw = null;
    try{
      raw = localStorage.getItem(STORAGE_KEY);
    }catch(e){
      console.warn("localStorage недоступен:", e);
      toast("Хранилище браузера недоступно");
      return defaultState();
    }
    if(!raw) return defaultState();
    try{
      return normalizeState(JSON.parse(raw));
    }catch(e){
      console.warn("Ошибка чтения сохранённых данных:", e);
      // Битые данные не удаляем молча — пробуем сохранить как бэкап
      try{ localStorage.setItem(STORAGE_KEY + ".broken." + Date.now(), raw); }catch(_){}
      toast("Данные были повреждены — загружен шаблон");
      return defaultState();
    }
  }

  function save(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){
      console.warn("Не удалось сохранить:", e);
      toast("Не удалось сохранить данные");
    }
  }

  /* ---------- Прогресс ---------- */
  function progressForDay(dayIdx, dateKey){
    const dk = dateKey || dateKeyNow();
    const byDate = state.progress[dk] || (state.progress[dk] = {});
    return byDate[dayIdx] || (byDate[dayIdx] = {});
  }
  function isDone(taskId, dayIdx, dateKey){
    const p = progressForDay(dayIdx, dateKey);
    return p[taskId] === true;
  }
  function setDone(taskId, done, dayIdx, dateKey){
    const p = progressForDay(dayIdx, dateKey);
    if(done) p[taskId] = true; else delete p[taskId];
    save();
  }

  /* ---------- Рендер ---------- */
  function renderTodayLine(){
    document.getElementById("todayLine").textContent = formatTodayLine();
  }

  function renderDaysNav(){
    const nav = document.getElementById("daysNav");
    nav.innerHTML = "";
    const today = todayIndex();
    for(let i=0;i<7;i++){
      const b = document.createElement("button");
      b.className = "day-btn" + (i === activeDay ? " active" : "");
      b.type = "button";
      b.textContent = DAYS[i];
      if(i === today){
        const dot = document.createElement("span");
        dot.className = "dot";
        b.appendChild(dot);
      }
      b.addEventListener("click", () => {
        activeDay = i;
        state.activeDay = i;
        save();
        render();
      });
      nav.appendChild(b);
    }
  }

  function renderDay(){
    const tasks = state.template[activeDay] || [];
    const dateKey = dateKeyNow();
    const list = document.getElementById("taskList");
    document.getElementById("dayTitle").textContent = DAYS_FULL[activeDay];
    list.innerHTML = "";

    if(tasks.length === 0){
      const div = document.createElement("div");
      div.className = "empty";
      div.textContent = "На этот день пока нет задач. Нажмите «Добавить задачу», чтобы начать.";
      list.appendChild(div);
    } else {
      let done = 0;
      tasks.forEach(t => {
        const isDoneTask = isDone(t.id, activeDay, dateKey);
        if(isDoneTask) done++;

        const li = document.createElement("li");
        li.className = "task" + (isDoneTask ? " done" : "");

        const check = document.createElement("button");
        check.className = "check";
        check.type = "button";
        check.setAttribute("aria-label", isDoneTask ? "Снять отметку" : "Отметить выполненной");
        check.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
        check.addEventListener("click", () => {
          const now = !isDone(t.id, activeDay, dateKey);
          setDone(t.id, now, activeDay, dateKey);
          render();
        });

        const body = document.createElement("div");
        body.className = "t-body";
        const timeEl = document.createElement("div");
        timeEl.className = "t-time";
        timeEl.textContent = timeLabel(t);
        const titleEl = document.createElement("div");
        titleEl.className = "t-title";
        titleEl.textContent = t.title;
        body.appendChild(timeEl);
        body.appendChild(titleEl);

        const actions = document.createElement("div");
        actions.className = "t-actions";

        // Вверх
        const up = document.createElement("button");
        up.className = "icon-btn";
        up.type = "button";
        up.title = "Выше";
        up.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>';
        up.addEventListener("click", () => moveTask(activeDay, t.id, -1));

        // Вниз
        const down = document.createElement("button");
        down.className = "icon-btn";
        down.type = "button";
        down.title = "Ниже";
        down.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>';
        down.addEventListener("click", () => moveTask(activeDay, t.id, +1));

        // Редактировать
        const edit = document.createElement("button");
        edit.className = "icon-btn";
        edit.type = "button";
        edit.title = "Редактировать";
        edit.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>';
        edit.addEventListener("click", () => openModal(activeDay, t));

        // Удалить
        const del = document.createElement("button");
        del.className = "icon-btn danger";
        del.type = "button";
        del.title = "Удалить";
        del.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>';
        del.addEventListener("click", () => {
          if(!confirm("Удалить задачу «" + t.title + "»?")) return;
          state.template[activeDay] = state.template[activeDay].filter(x => x.id !== t.id);
          // убираем прогресс для этой задачи в текущем дне
          const p = progressForDay(activeDay, dateKey);
          delete p[t.id];
          save();
          render();
          toast("Задача удалена");
        });

        actions.appendChild(up);
        actions.appendChild(down);
        actions.appendChild(edit);
        actions.appendChild(del);

        li.appendChild(check);
        li.appendChild(body);
        li.appendChild(actions);
        list.appendChild(li);
      });

      const total = tasks.length;
      const p = pct(done, total);
      document.getElementById("dayPct").innerHTML = p + "%<small>выполнено</small>";
      document.getElementById("dayCount").textContent = "Выполнено " + done + " из " + total + " задач";
      const bar = document.getElementById("dayBar");
      bar.style.width = p + "%";
      bar.parentElement.classList.toggle("green", p === 100 && total > 0);
      return;
    }

    // Пустой день
    document.getElementById("dayPct").innerHTML = "0%<small>выполнено</small>";
    document.getElementById("dayCount").textContent = "0 из 0 задач";
    const bar = document.getElementById("dayBar");
    bar.style.width = "0%";
    bar.parentElement.classList.remove("green");
  }

  function moveTask(dayIdx, taskId, delta){
    const arr = state.template[dayIdx];
    const idx = arr.findIndex(t => t.id === taskId);
    if(idx === -1) return;
    const j = idx + delta;
    if(j < 0 || j >= arr.length) return;
    const tmp = arr[idx]; arr[idx] = arr[j]; arr[j] = tmp;
    save();
    render();
  }

  function renderWeekAndStats(){
    const dateKey = dateKeyNow();
    let totalAll = 0, doneAll = 0;
    const stats = [];
    for(let i=0;i<7;i++){
      const tasks = state.template[i] || [];
      const total = tasks.length;
      const p = progressForDay(i, dateKey);
      const done = tasks.filter(t => p[t.id] === true).length;
      totalAll += total;
      doneAll += done;
      stats.push({ i, total, done, p: pct(done, total) });
    }
    const wp = pct(doneAll, totalAll);
    document.getElementById("weekPct").innerHTML = wp + "%<small>за неделю</small>";
    document.getElementById("weekCount").textContent = "Выполнено " + doneAll + " из " + totalAll + " задач";
    const wb = document.getElementById("weekBar");
    wb.style.width = wp + "%";

    const list = document.getElementById("statsList");
    list.innerHTML = "";
    stats.forEach(s => {
      const row = document.createElement("div");
      row.className = "stat-row";
      const d = document.createElement("span");
      d.className = "d";
      d.textContent = DAYS_FULL[s.i] + " · " + s.done + " из " + s.total;
      const v = document.createElement("span");
      v.className = "v";
      v.textContent = s.p + "%";
      row.appendChild(d);
      row.appendChild(v);
      list.appendChild(row);
    });
  }

  function render(){
    renderTodayLine();
    renderDaysNav();
    renderDay();
    renderWeekAndStats();
  }

  /* ---------- Модалка ---------- */
  function openModal(dayIdx, task){
    modalDay = dayIdx;
    editingId = task ? task.id : null;
    document.getElementById("modalTitle").textContent = task ? "Редактировать задачу" : "Добавить задачу";
    document.getElementById("fTitle").value = task ? task.title : "";
    document.getElementById("fStart").value = task && task.start ? task.start : "";
    document.getElementById("fEnd").value = task && task.end ? task.end : "";
    const err = document.getElementById("modalErr");
    err.classList.remove("show");
    err.textContent = "";
    document.getElementById("overlay").classList.add("open");
    setTimeout(() => document.getElementById("fTitle").focus(), 50);
  }
  function closeModal(){
    document.getElementById("overlay").classList.remove("open");
    editingId = null;
  }
  function modalError(msg){
    const err = document.getElementById("modalErr");
    err.textContent = msg;
    err.classList.add("show");
  }
  function saveModal(){
    const title = document.getElementById("fTitle").value.trim();
    let start = document.getElementById("fStart").value.trim();
    let end = document.getElementById("fEnd").value.trim();

    if(!title){
      modalError("Введите название задачи.");
      return;
    }
    if(start && end && start >= end){
      modalError("Время окончания должно быть позже времени начала.");
      return;
    }
    // Если задано только начало/конец — второй оставляем пустым (задача частично со временем)
    if(!start && end) start = "";
    if(!end && start) end = "";

    if(editingId){
      const arr = state.template[modalDay];
      const t = arr.find(x => x.id === editingId);
      if(t){
        t.title = title;
        t.start = start;
        t.end = end;
      }
    } else {
      const t = { id: uid(), title, start, end };
      const arr = state.template[modalDay] || (state.template[modalDay] = []);
      arr.push(t);
      // сортируем по времени старта при добавлении (пустые — в конец)
      arr.sort((a,b) => {
        if(!a.start && !b.start) return 0;
        if(!a.start) return 1;
        if(!b.start) return -1;
        return a.start.localeCompare(b.start);
      });
    }
    save();
    closeModal();
    render();
    toast(editingId ? "Задача обновлена" : "Задача добавлена");
  }

  /* ---------- Кнопки ---------- */
  document.getElementById("addTaskBtn").addEventListener("click", () => openModal(activeDay, null));
  document.getElementById("modalCancel").addEventListener("click", closeModal);
  document.getElementById("modalSave").addEventListener("click", saveModal);
  document.getElementById("fTitle").addEventListener("keydown", e => {
    if(e.key === "Enter"){ e.preventDefault(); saveModal(); }
  });
  document.getElementById("overlay").addEventListener("click", e => {
    if(e.target.id === "overlay") closeModal();
  });
  document.addEventListener("keydown", e => {
    if(e.key === "Escape" && document.getElementById("overlay").classList.contains("open")) closeModal();
  });

  document.getElementById("markAllBtn").addEventListener("click", () => {
    const tasks = state.template[activeDay] || [];
    if(tasks.length === 0){ toast("Нет задач"); return; }
    const dateKey = dateKeyNow();
    const p = progressForDay(activeDay, dateKey);
    const allDone = tasks.every(t => p[t.id] === true);
    tasks.forEach(t => {
      if(allDone) delete p[t.id];
      else p[t.id] = true;
    });
    save();
    render();
    toast(allDone ? "Отметки сняты" : "Все задачи отмечены");
  });

  document.getElementById("resetDayBtn").addEventListener("click", () => {
    if(!confirm("Сбросить прогресс за «" + DAYS_FULL[activeDay] + "»? Задачи останутся.")) return;
    const dateKey = dateKeyNow();
    state.progress[dateKey] = state.progress[dateKey] || {};
    state.progress[dateKey][activeDay] = {};
    save();
    render();
    toast("Прогресс дня сброшен");
  });

  document.getElementById("resetAllBtn").addEventListener("click", () => {
    if(!confirm("Сбросить прогресс за всю неделю? Расписание задач останется.")) return;
    state.progress = {};
    save();
    render();
    toast("Прогресс недели сброшен");
  });

  document.getElementById("resetTemplateBtn").addEventListener("click", () => {
    if(!confirm("Сбросить шаблон расписания к начальному? Все ваши задачи будут заменены. Прогресс также очистится.")) return;
    state.template = starterTemplate();
    state.progress = {};
    save();
    render();
    toast("Шаблон сброшен");
  });

  /* ---------- Экспорт / импорт ---------- */
  document.getElementById("exportBtn").addEventListener("click", () => {
    const data = {
      app: "My Weekly Planner",
      exportedAt: new Date().toISOString(),
      data: state
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const d = new Date();
    a.href = url;
    a.download = "weekly-planner-" + dateKeyNow() + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast("Файл экспортирован");
  });

  document.getElementById("importBtn").addEventListener("click", () => {
    document.getElementById("importFile").click();
  });
  document.getElementById("importFile").addEventListener("change", (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const parsed = JSON.parse(String(reader.result));
        const incoming = parsed && parsed.data ? parsed.data : parsed;
        if(!incoming || typeof incoming !== "object") throw new Error("bad format");
        if(!incoming.template && !incoming.progress) throw new Error("bad format");
        if(!confirm("Импортировать данные? Текущее расписание и прогресс будут заменены.")) return;
        state = normalizeState(incoming);
        activeDay = clamp(Number(state.activeDay)||0, 0, 6);
        save();
        render();
        toast("Данные импортированы");
      }catch(err){
        console.warn(err);
        alert("Не удалось импортировать: файл повреждён или имеет неверный формат.");
      }
    };
    reader.onerror = () => alert("Не удалось прочитать файл.");
    reader.readAsText(file, "utf-8");
  });

  /* ---------- Автообновление при возврате/смене дня ---------- */
  let lastDateKey = dateKeyNow();
  function checkDateRollover(){
    const nowKey = dateKeyNow();
    if(nowKey !== lastDateKey){
      lastDateKey = nowKey;
      render();
    }
  }
  document.addEventListener("visibilitychange", () => {
    if(!document.hidden){
      checkDateRollover();
      renderTodayLine();
    }
  });
  setInterval(checkDateRollover, 60 * 1000);

  /* ---------- Инициализация ---------- */
  state = load();
  activeDay = clamp(Number(state.activeDay)||0, 0, 6);
  save(); // сохраняем нормализованное состояние
  render();

  // Небольшая проверка localStorage на доступность
  try{
    const testKey = "__planner_test__";
    localStorage.setItem(testKey, "1");
    localStorage.removeItem(testKey);
  }catch(e){
    toast("Внимание: сохранение недоступно в этом браузере");
  }
})();
</script>
</body>
</html>
